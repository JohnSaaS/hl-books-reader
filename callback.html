<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Connection Code</title>
<style>body{font-family:Georgia,serif;max-width:680px;margin:40px auto;padding:0 16px;line-height:1.6;color:#222;background:#fff}h1{font-size:1.6em}textarea{width:100%;height:7em;font-family:monospace;font-size:13px}button{font-size:1em;padding:6px 14px;margin-top:8px}</style>
</head><body>
<h1>Almost Done</h1>
<p id="msg">Copy the text below and paste it back to Claude on your Mac. It works once and expires in a few minutes.</p>
<textarea id="out" readonly></textarea>
<button id="copy" type="button">Copy</button>
<p>This page does not save or send anything. The text only works together with the firm's private key.</p>
<script>
  var url = window.location.href;
  var q = new URLSearchParams(window.location.search);
  var out = document.getElementById('out');
  if (!q.get('code')) {
    document.getElementById('msg').textContent = q.get('error') ? 'Intuit returned an error: ' + q.get('error') : 'No connection code found on this page.';
  }
  out.value = url;
  document.getElementById('copy').onclick = function () {
    out.select();
    try { navigator.clipboard.writeText(url); } catch (e) { document.execCommand('copy'); }
    this.textContent = 'Copied';
  };
</script>
</body></html>
