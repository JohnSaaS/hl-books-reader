<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Connecting</title>
<style>body{font-family:Georgia,serif;max-width:680px;margin:40px auto;padding:0 16px;line-height:1.6;color:#222;background:#fff}h1{font-size:1.6em}</style>
</head><body>
<h1>Connecting...</h1>
<p id="msg">Handing the connection to the firm's computer. This page does not show, save, or send the code anywhere else.</p>
<script>
  var search = window.location.search;
  var q = new URLSearchParams(search);
  // Take the code out of the address bar and history right away.
  try { history.replaceState(null, '', window.location.pathname); } catch (e) {}
  if (q.get('error')) {
    document.getElementById('msg').textContent = 'Intuit returned an error: ' + q.get('error');
  } else if (!q.get('code')) {
    document.getElementById('msg').textContent = 'No connection code found on this page.';
  } else {
    window.location.replace('http://127.0.0.1:8765/cb' + search);
    setTimeout(function () {
      document.getElementById('msg').textContent = 'If you are still seeing this, the connect script is not running on the firm computer. Start it and try connecting again.';
    }, 4000);
  }
</script>
</body></html>
